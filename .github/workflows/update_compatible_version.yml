name: Update Compatible Versions

on:
  pull_request:
    branches:
      - testing   # Triggers only when PR is merged into `testing`
    types:
      - closed    # Ensures it runs only on PR closure (merge)

jobs:
  update-compatible-versions:
    if: github.event.pull_request.merged == true  # Runs only if PR is merged
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Versions from PR
        id: extract_versions
        run: |
          PR_BODY="${{ github.event.pull_request.body }}"
          echo "$PR_BODY"

          # Extract the "## Versions" section
          echo "$PR_BODY" | awk '/## Versions/{flag=1; next} /^## /{flag=0} flag' > PR_VERSIONS.md

          # Read extracted content
          CLI_VERSION=$(grep -oP '(?<=- Pilot Release Version: ).*' PR_VERSIONS.md | tr -d '\r')
          COMPATIBLE_VERSION=$(grep -oP '(?<=- Compatible Version: ).*' PR_VERSIONS.md | tr -d '\r')

          # Handle missing values
          CLI_VERSION=${CLI_VERSION:-"Unknown"}
          COMPATIBLE_VERSION=${COMPATIBLE_VERSION:-"Unknown"}

          # Get the latest Git tag (assuming it's the CLI version)
          LATEST_CLI_VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "Unknown")

          # Append new entry
          echo "| $LATEST_CLI_VERSION | $CLI_VERSION | $COMPATIBLE_VERSION |" >> docs/compatible_version.md

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/compatible_version.md
          git commit -m "Updated docs/compatible_version.md with PR #${{ github.event.pull_request.number }}"
          git push
        continue-on-error: true  # Avoid breaking workflow if no changes detected
