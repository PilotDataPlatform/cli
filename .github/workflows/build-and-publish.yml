name: Build and Publish

on:
  workflow_run:
    workflows: [ "Run Tests" ]
    branches:
      - develop
      - patch/20260128-fixup-pipeline
    # types:
    #   - completed
  push:
    branches:
      - main
      - patch/20260128-fixup-pipeline

  # pull_request:
  #   types:
  #     - closed

jobs:
  pre-build-setup:
    runs-on: ubuntu-latest
    # if: github.event.pull_request.merged == true  # Runs only if PR is merged

    outputs:
      branch: ${{steps.extract_branch.outputs.branch}}
    steps:
      - name: Extract Branch Name
        id: extract_branch
        shell: bash
        run: echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

      - name: Extract PR Summary and Versions
        id: extract_content
        run: |
          PR_BODY="${{ github.event.pull_request.body }}"

          # Extract Summary
          echo "$PR_BODY" | awk '/## Summary/{flag=1; next} /^## /{flag=0} flag' > PR_SUMMARY.md
          echo "" >> PR_SUMMARY.md

          # Extract Versions
          echo "$PR_BODY" | awk '/## Versions/{flag=1; next} /^## /{flag=0} flag' > PR_VERSIONS.md
          echo "" >> PR_VERSIONS.md

          # Read extracted content
          PILOT_VERSION=$(grep -oP '(?<=- Pilot Release Version: ).*' PR_VERSIONS.md | tr -d '\r')
          COMPATIBLE_VERSION=$(grep -oP '(?<=- Compatible Version: ).*' PR_VERSIONS.md | tr -d '\r')

          # Handle missing values
          PILOT_VERSION=${PILOT_VERSION:-"Unknown"}
          COMPATIBLE_VERSION=${COMPATIBLE_VERSION:-"Unknown"}

          # Create a structured release message
          echo "## Release Notes" > RELEASE_MESSAGE.md
          echo "" >> RELEASE_MESSAGE.md
          echo "### Summary" >> RELEASE_MESSAGE.md
          cat PR_SUMMARY.md >> RELEASE_MESSAGE.md
          echo "" >> RELEASE_MESSAGE.md
          echo "### Versions" >> RELEASE_MESSAGE.md
          echo "- **Pilot Release Version:** $PILOT_VERSION" >> RELEASE_MESSAGE.md
          echo "- **Compatible Version:** $COMPATIBLE_VERSION" >> RELEASE_MESSAGE.md

      - name: Upload Release Message as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-message
          path: RELEASE_MESSAGE.md


  push-binary-linux:
    needs: [ pre-build-setup ]
    if: ${{ needs.pre-build-setup.outputs.branch == 'patch/20260128-fixup-pipeline' || needs.pre-build-setup.outputs.branch == 'develop'}}
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{steps.create_release.outputs.upload_url}}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: ${{ needs.pre-build-setup.outputs.branch }}

      - name: Download Release Message Artifact
        uses: actions/download-artifact@v4
        with:
          name: release-message

      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Create Docker build script
        run: |
          cat > build_script.sh << 'EOF'
          #!/bin/bash
          set -e

          # Install Poetry
          export POETRY_HOME=/opt/poetry
          export PATH=$POETRY_HOME/bin:$PATH

          # Install dependencies and build binaries
          cd /github/workspace
          poetry install --no-interaction

          # Build default binary
          poetry run pyinstaller -F \
            --distpath ./app/bundled_app/linux \
            --specpath ./app/build/linux \
            --workpath ./app/build/linux \
            --paths=./.venv/lib/python3.10/site-packages \
            ./app/pilotcli.py -n $GITHUB_SHA

          # Rename default output file
          mv "./app/bundled_app/linux/$GITHUB_SHA" "./app/bundled_app/linux/pilotcli_linux"

          # Enable cloud mode
          touch ./app/ENABLE_CLOUD_MODE

          # Build cloud binary
          poetry run pyinstaller -F \
            --distpath ./app/bundled_app/linux \
            --specpath ./app/build/linux \
            --workpath ./app/build/linux \
            --add-binary=$(pwd)/app/ENABLE_CLOUD_MODE:. \
            --paths=./.venv/lib/python3.10/site-packages \
            ./app/pilotcli.py -n $GITHUB_SHA

          # Rename cloud output file
          mv "./app/bundled_app/linux/$GITHUB_SHA" "./app/bundled_app/linux/pilotcli_cloud"

          # Set version in env
          echo "TAG_VERSION=$(poetry version --short)" > /github/workspace/version.txt

          # Ensure permissions are correct
          chmod -R 777 /github/workspace/app/bundled_app
          EOF

          chmod +x build_script.sh

      - name: Build binaries with Ubuntu 20.04 Docker
        run: |
          mkdir -p ./app/bundled_app/linux
          mkdir -p ./app/build/linux

          docker run --rm \
            -v ${{ github.workspace }}:/github/workspace \
            -v ${{ github.workspace }}/build_script.sh:/build_script.sh \
            -e GITHUB_SHA=${{ github.sha }} \
            -w /github/workspace \
            ubuntu:22.04 bash -c "
              set -e
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y software-properties-common curl build-essential
              add-apt-repository -y ppa:deadsnakes/ppa
              apt-get update
              apt-get install -y python3.10 python3.10-venv python3.10-dev
              curl -sS https://bootstrap.pypa.io/get-pip.py | python3.10
              curl -sSL https://install.python-poetry.org | python3.10 -
              export PATH=\"/root/.local/bin:\$PATH\"
              /build_script.sh
            "

          # Load version from file created in container
          echo "TAG_VERSION=$(cat version.txt | cut -d'=' -f2)" >> $GITHUB_ENV

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG_VERSION }}
          name: Release ${{ needs.pre-build-setup.outputs.branch }} ${{ env.TAG_VERSION }}
          body_path: RELEASE_MESSAGE.md
          draft: false
          prerelease: false
          target_commitish: ${{ needs.pre-build-setup.outputs.branch }}
          files: |
            ./app/bundled_app/linux/pilotcli_linux
            ./app/bundled_app/linux/pilotcli_cloud

  push-binary-macos:
    needs: [ push-binary-linux ]
    if: ${{ needs.pre-build-setup.outputs.branch == 'patch/20260128-fixup-pipeline' || needs.pre-build-setup.outputs.branch == 'develop'}}
    runs-on: macos-15-intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: ${{ needs.pre-build-setup.outputs.branch }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.10.12

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.3
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: Set up cache
        id: cached-poetry-dependencies
        uses: actions/cache@v3
        with:
          path: .venv
          key: venv-linux-${{ hashFiles('**/poetry.lock') }}

      - name: Ensure cache is healthy
        if: steps.cached-poetry-dependencies.outputs.cache-hit == 'true'
        run: timeout 10s poetry run pip --version || rm -rf .venv

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Build binary
        run: poetry run pyinstaller -F --distpath ./app/bundled_app/macos --specpath ./app/build/macos --workpath ./app/build/macos --paths=./.venv/lib/python3.10/site-packages ./app/pilotcli.py -n ${{ github.sha }}

      - name: Upload Release Binary
        id: upload-release-binary
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.push-binary-linux.outputs.upload_url }}
          asset_path: ./app/bundled_app/macos/${{ github.sha }}
          asset_name: pilotcli_macos
          asset_content_type: application/octet-stream

  push-binary-windows:
    needs: [ push-binary-linux ]
    if: ${{ needs.pre-build-setup.outputs.branch == 'patch/20260128-fixup-pipeline' || needs.pre-build-setup.outputs.branch == 'develop'}}
    runs-on: windows-2025
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: ${{ needs.pre-build-setup.outputs.branch }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          architecture: 'x64'

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~\AppData\Local\pip\Cache
          key: pip-windows-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            pip-windows-${{ runner.os }}-

      - name: Install dependencies
        shell: pwsh
        run: |
          # Ensure clean venv each run (prevents broken distlib / uninstall issues)
          Remove-Item -Recurse -Force .venv -ErrorAction SilentlyContinue

          # Create venv + activate
          python -m venv .venv
          .\.venv\Scripts\python -m pip install --upgrade pip setuptools wheel

          # Force Poetry to use this exact venv python
          poetry env use (Resolve-Path .\.venv\Scripts\python).Path

          # Install deps strictly from lock
          poetry install --no-interaction --no-ansi --extras "windows" --only main

      - name: Install Poetry + configure
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "poetry==1.8.3"

          # Make Poetry use in-project venv and avoid parallelism (prevents Win file-lock issues)
          poetry config virtualenvs.in-project true
          poetry config installer.max-workers 1

      - name: Build binary
        run: |
          .\.venv\Scripts\Activate
          poetry run pyinstaller -F --distpath ./app/bundled_app/windows --specpath ./app/build/windows --workpath ./app/build/windows --paths=./.venv/lib/python3.10/site-packages ./app/pilotcli.py -n ${{ github.sha }}
        shell: pwsh

      - name: Upload Release Binary
        id: upload-release-binary
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.push-binary-linux.outputs.upload_url }}
          asset_path: ./app/bundled_app/windows/${{ github.sha }}.exe
          asset_name: pilotcli_windows.exe
          asset_content_type: application/octet-stream
